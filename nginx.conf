server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 知识库要上传 PDF/DOCX 等文件，nginx 默认只允许 1MB，会 413。放大上限。
    client_max_body_size 20m;

    # 前端是 SPA（vue-router）：刷新子路由时文件不存在，回退到 index.html 交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反向代理到 backend 容器（backend 是 compose 里的服务名，即容器主机名）
    # 前端请求同源 /api，由 nginx 内部转发 → 无 CORS、baseURL 不用写死后端 IP
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型回答慢，nginx 默认 60s 会 504 掐断。放宽到与前端 axios 超时(300s)一致。
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
